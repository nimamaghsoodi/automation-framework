key: code
name: Code
version: "1.0.0"
category: utility
description: >
  Execute a Python script as a step in your flow. The script receives inputs
  from previous nodes and can produce any output dict.
icon_url: null
required_scopes: []

auth:
  type: none
  fields: []

triggers: []

actions:
  - key: run_python
    name: Run Python
    description: >
      Execute a Python script. Available variable: `inputs` (flat dict of all
      predecessor node outputs merged together). Set `output` to return data
      to the next step. Full Python stdlib is available (urllib, json, re, etc.).
    code_editor: true
    language: python
    input_schema:
      type: object
      required: [source_code]
      properties:
        source_code:
          type: string
          title: Python Script
          x-editor: code
          x-language: python
          description: >
            Python script. `inputs` is a flat dict of all predecessor step
            outputs merged together. Set `output` to pass data forward.
            Full stdlib available: urllib, json, re, datetime, etc.
          default: |
            # inputs: flat dict of predecessor step outputs
            # Full Python stdlib available

            output = {
                "result": "hello from code node",
                "step_count": len(inputs),
            }
        timeout_seconds:
          type: integer
          title: Timeout (seconds)
          description: Maximum execution time before the script is killed.
          default: 30
