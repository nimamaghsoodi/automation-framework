services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus_dev@postgres:5432/nexus
      DATABASE_URL_SYNC: postgresql+psycopg2://nexus:nexus_dev@postgres:5432/nexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: development
      DEBUG: "true"
      # Mount sdk/connectors directly into PYTHONPATH — no pip reinstall needed
      PYTHONPATH: /app:/sdk:/connectors
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./packages/sdk:/sdk
      - ./packages/connectors:/connectors
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus_dev@postgres:5432/nexus
      DATABASE_URL_SYNC: postgresql+psycopg2://nexus:nexus_dev@postgres:5432/nexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: development
      PYTHONPATH: /app:/sdk:/connectors
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./packages/sdk:/sdk
      - ./packages/connectors:/connectors
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4

  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus_dev@postgres:5432/nexus
      DATABASE_URL_SYNC: postgresql+psycopg2://nexus:nexus_dev@postgres:5432/nexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: development
      PYTHONPATH: /app:/sdk:/connectors
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./packages/sdk:/sdk
      - ./packages/connectors:/connectors
    command: celery -A app.celery_app beat --loglevel=info

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  redis_data:
